name: 构建签名 IPA

# 需要 Apple 开发者证书才能跑，所以只支持手动触发。
# 先在仓库 Settings → Secrets and variables → Actions 里配好这几个 secret：
#
#   BUILD_CERTIFICATE_BASE64        导出的 .p12 证书，base64
#   P12_PASSWORD                    导出 .p12 时设的密码
#   BUILD_PROVISION_PROFILE_BASE64  对应的 .mobileprovision，base64
#   KEYCHAIN_PASSWORD               随便写一个字符串，只用于临时钥匙串
#
# 转 base64（macOS）：base64 -i cert.p12 | pbcopy
# Team ID 和 Bundle ID 会直接从描述文件里读出来，不用另外配。

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 导出方式
        type: choice
        default: debugging
        options:
          - debugging          # 旧称 development，装到已注册的设备上
          - release-testing    # 旧称 ad-hoc，分发给已注册设备
          - app-store-connect  # 上传 App Store / TestFlight
          - enterprise         # 企业证书内部分发
      make_release:
        description: 同时创建一个 GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # 这里不要写 ${{ inputs.* }}：GitHub 每次 push 都会校验所有工作流文件，
    # 而 push 事件下没有 inputs 上下文，job 名又是解析期就求值的，会被判成非法工作流。
    name: 签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    env:
      PROJECT: Photo.xcodeproj
      SCHEME: Photo
      APP_NAME: Photo

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 阅读核心回归测试
        run: python3 Tools/Checks/run_reader_tests.py

      - name: 检查 secret 是否齐全
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12PW: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KCPW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          [ -z "$CERT" ]    && missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -z "$P12PW" ]   && missing="$missing P12_PASSWORD"
          [ -z "$PROFILE" ] && missing="$missing BUILD_PROVISION_PROFILE_BASE64"
          [ -z "$KCPW" ]    && missing="$missing KEYCHAIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少这些 secret：$missing —— 请到仓库 Settings → Secrets and variables → Actions 配置"
            exit 1
          fi
          echo "secret 齐全"

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

          # 同 build-ipa.yml：不能把 xcodebuild -version 接进 head，会 broken pipe
          version_output="$(xcodebuild -version)"
          echo "$version_output"
          major="$(printf '%s\n' "$version_output" | sed -n '1s/^Xcode \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$major" ] || [ "$major" -lt 16 ]; then
            echo "::error::需要 Xcode 16 或更高，检测到：${major:-未知}"
            exit 1
          fi

      - name: 导入证书和描述文件
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/cert.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          keychain="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$cert"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$profile"

          # 建一个只在本次运行中存在的临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"

          # 描述文件里已经带了 Team ID 和 Bundle ID，直接读出来用
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" "$RUNNER_TEMP/profile.plist")
          appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          bundle="${appid#$team.}"

          if [ "$bundle" = "*" ]; then
            echo "::error::这是通配描述文件，请改用绑定了具体 Bundle ID 的描述文件"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

          # 只取带引号的证书名，避免把 "0 valid identities found" 这类汇总行当成身份。
          # 先整段捕获再解析，sed 会读完整个流，不会像 head 那样提前关管道。
          identities="$(security find-identity -v -p codesigning "$keychain" || true)"
          identity="$(printf '%s\n' "$identities" | sed -n 's/.*"\(.*\)".*/\1/p' | sed -n '1p')"
          if [ -z "$identity" ]; then
            echo "::error::临时钥匙串里没有可用的签名证书，检查 .p12 和密码"
            exit 1
          fi

          echo "描述文件：$name"
          echo "Team ID  ：$team"
          echo "Bundle ID：$bundle"
          echo "签名身份 ：$identity"

          {
            echo "keychain=$keychain"
            echo "profile_name=$name"
            echo "team=$team"
            echo "bundle=$bundle"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

      - name: 归档
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ steps.signing.outputs.bundle }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}"

      - name: 导出 IPA
        id: export
        run: |
          set -euo pipefail
          # heredoc 用单引号包起来：Actions 的表达式在 shell 拿到脚本之前
          # 就已经替换完了，加引号只是防止证书名里万一有 $ 被 shell 再展开一次。
          #
          # 注意：脚本里不要出现空的表达式占位符（两个花括号中间什么都没有）。
          # Actions 的替换发生在 shell 之前，不管它是不是 shell 注释，
          # 一律当表达式解析，空的会直接让整个工作流文件被判非法。
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>teamID</key><string>${{ steps.signing.outputs.team }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ steps.signing.outputs.bundle }}</key>
              <string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          # 用 glob 取第一个，避免 ls | head 的管道问题
          ipa=""
          for f in "$RUNNER_TEMP/export"/*.ipa; do ipa="$f"; break; done
          if [ -z "$ipa" ] || [ ! -f "$ipa" ]; then
            echo "::error::导出目录里没有 .ipa"
            ls -R "$RUNNER_TEMP/export" || true
            exit 1
          fi
          size="$(du -h "$ipa" | cut -f1)"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          echo "### 签名构建完成 :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "- 导出方式：\`${{ inputs.export_method }}\`（${size}）" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle ID：\`${{ steps.signing.outputs.bundle }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build 号：${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-${{ inputs.export_method }}-${{ github.run_number }}
          path: ${{ steps.export.outputs.ipa }}
          retention-days: 30
          if-no-files-found: error

      - name: 创建 Release
        if: inputs.make_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          gh release create "$tag" "${{ steps.export.outputs.ipa }}" \
            --title "$APP_NAME build ${{ github.run_number }}" \
            --notes "签名方式：${{ inputs.export_method }}"

      - name: 清理临时钥匙串
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
