name: 构建 IPA

# 推 main/master、打 v* 标签、提 PR 或手动触发时，都会跑一次构建。
# 产出的是「未签名 IPA」——不需要配置任何 Apple 证书就能跑通，
# 装到手机上要用 Sideloadly / AltStore 之类的工具自签。
# 想直接出可安装的签名包，用 build-signed-ipa.yml。

on:
  push:
    branches: [main, master, dev, book]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 打标签时创建 Release 需要写权限

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 未签名 IPA
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PROJECT: Photo.xcodeproj
      SCHEME: Photo
      APP_NAME: Photo

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 阅读核心回归测试
        run: python3 Tools/Checks/run_reader_tests.py

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          echo "机器上可用的 Xcode："
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

          # 不要写成 xcodebuild -version | head -1：head 读完首行就关管道，
          # Xcode 26 的 xcodebuild 继续写会撞 broken pipe 并抛未捕获异常直接 abort（134），
          # 叠加 pipefail 就会让整步失败。先整段捕获再解析。
          version_output="$(xcodebuild -version)"
          echo "$version_output"

          # 工程用了 Xcode 16 的文件系统同步分组（objectVersion 77），低版本打不开
          major="$(printf '%s\n' "$version_output" | sed -n '1s/^Xcode \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$major" ] || [ "$major" -lt 16 ]; then
            echo "::error::需要 Xcode 16 或更高（工程用了文件系统同步分组），检测到：${major:-未知}"
            exit 1
          fi

      - name: 列出工程结构
        run: xcodebuild -list -project "$PROJECT"

      - name: 归档（跳过代码签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 检查网页图标格式
        run: python3 Tools/Checks/check_web_icon.py "$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app/WebIcon.png"

      - name: 打包成 IPA
        id: package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          if [ ! -d "$app" ]; then
            echo "::error::归档里没找到 $APP_NAME.app"
            ls -R "$RUNNER_TEMP/$APP_NAME.xcarchive/Products" || true
            exit 1
          fi

          # IPA 本质就是把 .app 放进 Payload/ 再压缩
          work="$RUNNER_TEMP/ipa"
          mkdir -p "$work/Payload"
          cp -R "$app" "$work/Payload/"
          ( cd "$work" && zip -qry "$RUNNER_TEMP/$APP_NAME-unsigned.ipa" Payload )

          size=$(du -h "$RUNNER_TEMP/$APP_NAME-unsigned.ipa" | cut -f1)
          echo "ipa=$RUNNER_TEMP/$APP_NAME-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          # 变量后面紧跟中文标点时必须加大括号：runner 的 bash 会把中文字节
          # 当成变量名的一部分，配合 set -u 会报 "size?: unbound variable"
          echo "### 构建完成 :package:" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件：\`${APP_NAME}-unsigned.ipa\`（${size}，未签名）" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build 号：${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa-${{ github.run_number }}
          path: ${{ steps.package.outputs.ipa }}
          retention-days: 30
          if-no-files-found: error

      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          这是**未签名**的 IPA，不能直接双击安装，需要用工具自签后侧载：

          - **Sideloadly**（Windows / macOS）：拖进去，填 Apple ID，点 Start
          - **AltStore**：加到 AltStore 里安装
          - **TrollStore**（系统版本支持的话）：可直接安装且不会过期

          用免费 Apple ID 自签有效期 7 天，到期重签即可。

          装好后第一次开「WiFi 上传」，系统会问「本地网络」权限，要允许。
          EOF

      - name: 打标签时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.ipa }}" \
            --title "$APP_NAME $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
